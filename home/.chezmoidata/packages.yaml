packages:
  base:
    - git # control de versiones
    - less # paginador que usa git (log, diff, etc.) por defecto
    - curl # descarga de archivos desde terminal
    - base-devel # herramientas básicas de compilación
    - go # toolchain para compilar software en Go
    - stow # ya no se usa para aplicar dotfiles, pero puede quedar como dependencia general

  pacman:
    - kitty # emulador de terminal, usado como terminal por defecto en hyprland.lua
    - tree-sitter-cli # CLI para desarrollar, testear y usar parsers de tree-sitter
    - fd # alternativa simple y rápida a find
    - lua-language-server # language server de Lua
    - wl-clipboard # utilidades de copiar/pegar para Wayland
    - swayimg # visor de imágenes liviano para Wayland
    - matugen # generador de paletas de color Material You
    - adw-gtk-theme # port no oficial del tema de libadwaita para GTK 3
    - hypridle # demonio de inactividad de Hyprland
    - hyprsunset # filtro de luz azul para Hyprland
    - grim # capturas de pantalla (Quickshell: capturas, selector de color)
    - libvips # vipsthumbnail: miniaturas del selector de fondos de Quickshell
    - networkmanager # gestiona la red (cable y WiFi); lo usa el panel de WiFi de Quickshell
    - wpa_supplicant # backend de WiFi de NetworkManager
    - gpu-screen-recorder # grabación de pantalla de Quickshell (codifica con la GPU)
    - slurp # selección de región para grabar la pantalla
    - ffmpeg # miniatura de las grabaciones para la notificación
    - thunar # gestor de archivos gráfico
    - gvfs # soporte para montar dispositivos y red
    - ntfs-3g # soporte de lectura/escritura para unidades NTFS
    - tumbler # generador de miniaturas para Thunar
    - ffmpegthumbnailer # miniaturas de video
    - mpv # reproductor multimedia
    - file-roller # gestor de archivos comprimidos
    - thunar-archive-plugin # integración de archivos comprimidos en Thunar
    - thunar-media-tags-plugin # metadatos multimedia en Thunar
    - thunar-shares-plugin # compartir carpetas en red
    - thunar-volman # automontaje de dispositivos
    - superfile # explorador de archivos en terminal
    - lazygit # interfaz TUI para Git
    - fastfetch # información del sistema
    - github-cli # CLI de GitHub
    - zed # editor de código
    - stylua # formateador de Lua, usado por zed en hyprland.lua
    - xdg-desktop-portal # servicio base de portales XDG
    - xdg-desktop-portal-hyprland # backend portal para Hyprland
    - xdg-desktop-portal-gtk # fallback GTK para FileChooser/OpenURI
    - polkit-gnome # autenticación gráfica de permisos
    - quickshell # framework de widgets para Wayland
    - greetd # gestor de inicio de sesión (la pantalla de inicio es Quickshell, ver quickshell-greeter)
    - plymouth # pantalla de carga al arrancar (tema propio en ~/.config/plymouth-theme)
    - ttf-jetbrains-mono-nerd # fuente Nerd Font
    - neovim # editor de texto en terminal
    - fish # shell moderna
    - eza # reemplazo moderno de ls
    - zoxide # navegación inteligente entre directorios
    - starship # prompt personalizable
    - pacman-contrib # utilidades adicionales para pacman
    - bluez # pila de Bluetooth
    - bluez-utils # utilidades CLI para Bluetooth (bluetoothctl)
    - blueman # interfaz gráfica para Bluetooth
    - os-prober # detección de otros sistemas operativos
    - refind # gestor de arranque UEFI

  aur:
    - python-pywalfox # app nativa para la extensión de navegador Pywalfox
    - tidal-hifi # cliente de escritorio de Tidal con soporte HiFi
