font_family      JetBrainsMono Nerd Font
font_size        10.5
confirm_os_window_close 0

# Colores generados por paleta (~/.local/bin/paleta) desde el fondo de pantalla
globinclude velure.conf

# Fondo translúcido con "Barra y paneles translúcidos" de Quickshell (lo escribe
# ~/.config/velure/scripts/translucent.sh); dynamic_background_opacity deja que
# cambie al recargar la config
dynamic_background_opacity yes
globinclude translucent.conf
