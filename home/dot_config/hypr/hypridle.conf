# hypridle: bloquea la pantalla antes de suspender (pantalla de bloqueo de Quickshell).
# Los tiempos de inactividad (bloquear, apagar pantallas, suspender) los lleva Quickshell
# y se ajustan en el panel de ajustes → Inactividad (services/Idle.qml).

general {
    # Lo que se ejecuta con "loginctl lock-session" (no bloquea dos veces)
    lock_cmd = quickshell ipc call lock lock
    # Bloquear antes de suspender, para que al volver pida la contraseña
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
