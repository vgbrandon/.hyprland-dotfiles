# hypridle: bloqueo automático por inactividad (pantalla de bloqueo de Quickshell)

general {
    # Lo que se ejecuta con "loginctl lock-session" (no bloquea dos veces)
    lock_cmd = quickshell ipc call lock lock
    # Bloquear antes de suspender, para que al volver pida la contraseña
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 minutos sin actividad: bloquear
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 minutos: apagar las pantallas (se encienden al mover el ratón o tocar una tecla)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
