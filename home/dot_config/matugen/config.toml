# Paleta Material You generada desde el fondo de pantalla.
# Quickshell ejecuta matugen cada vez que cambia el fondo y genera estas plantillas.
[config]

# Colores extra "armonizados" con el fondo (se acercan a su tono pero siguen
# siendo distintos). Los usa el resaltado de sintaxis y la terminal de Zed.
[config.custom_colors]
red = { color = "#e06c75", blend = true }
orange = { color = "#d19a66", blend = true }
yellow = { color = "#e5c07b", blend = true }
green = { color = "#98c379", blend = true }
cyan = { color = "#56b6c2", blend = true }
blue = { color = "#61afef", blend = true }
magenta = { color = "#c678dd", blend = true }

[templates.zed]
input_path = '~/.config/matugen/templates/zed.json'
output_path = '~/.config/zed/themes/matugen.json'

# kitty: los colores se cargan con "globinclude matugen.conf" en kitty.conf.
# SIGUSR1 hace que las ventanas de kitty abiertas recarguen la config al instante.
[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/matugen.conf'
post_hook = 'pkill -USR1 -x kitty || true'

# starship: la paleta se une con starship.toml (ver scripts/starship.sh).
# Starship lee la config en cada prompt, así que el cambio se ve al instante.
[templates.starship]
input_path = '~/.config/matugen/templates/starship-palette.toml'
output_path = '~/.config/starship/palette-matugen.toml'
post_hook = 'sh ~/.config/matugen/scripts/starship.sh --notify'

# eza (ls): tema de colores; los iconos toman el color de cada tipo de archivo
[templates.eza]
input_path = '~/.config/matugen/templates/eza-theme.yml'
output_path = '~/.config/eza/theme.yml'

# GTK3: tema propio "Matugen" (adw-gtk3-dark + colores). Al alternar el tema un
# instante, las apps GTK3 abiertas recargan los archivos del tema y sus colores.
[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-theme.css'
output_path = '~/.local/share/themes/Matugen/gtk-3.0/gtk.css'

[templates.gtk3-colors]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.local/share/themes/Matugen/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark && sleep 0.1 && gsettings set org.gnome.desktop.interface gtk-theme Matugen'

# GTK4/libadwaita: lee ~/.config/gtk-4.0/gtk.css al abrir cada app
[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

# Iconos: tema "Matugen" (Adwaita con carpetas del color del fondo). Al alternar
# el tema de iconos un instante, las apps GTK abiertas los recargan.
[templates.icons]
input_path = '~/.config/matugen/templates/icons-color'
output_path = '~/.local/share/icons/Matugen/.color'
post_hook = 'python3 ~/.config/matugen/scripts/icons.py && gsettings set org.gnome.desktop.interface icon-theme Adwaita && sleep 0.1 && gsettings set org.gnome.desktop.interface icon-theme Matugen'

# Firefox (extensión Pywalfox): lee los colores en formato de pywal desde
# ~/.cache/wal/colors.json; "pywalfox update" le avisa a Firefox al instante.
[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'command -v pywalfox >/dev/null && pywalfox update || true'

# Firefox al arrancar: userChrome.css con los mismos colores, para que no se vea
# el tema por defecto antes de que cargue Pywalfox (ver scripts/firefox.sh)
[templates.firefox]
input_path = '~/.config/matugen/templates/firefox-userChrome.css'
output_path = '~/.cache/matugen/firefox-userChrome.css'
post_hook = 'sh ~/.config/matugen/scripts/firefox.sh'

# tidal-hifi: tema "matugen" (seleccionado en su config como user:matugen.css).
# Tidal lo aplica al cargar la página: si está abierto se recarga (Ctrl+R).
[templates.tidal]
input_path = '~/.config/matugen/templates/tidal.css'
output_path = '~/.config/tidal-hifi/themes/matugen.css'
post_hook = 'sh ~/.config/matugen/scripts/tidal.sh'
