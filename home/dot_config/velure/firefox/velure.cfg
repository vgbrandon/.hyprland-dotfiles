// Velure: estilos de Velure en Firefox, en vivo (autoconfig; lo instala chezmoi en
// /usr/lib/firefox con defaults/pref/velure-autoconfig.js).
// Carga en el marco de Firefox (pestañas, barras, menús) los colores de la paleta y la
// capa translúcida, y los vuelve a cargar cuando cambian (paleta al cambiar de fondo,
// translucent.sh al encender o apagar "Barra y paneles translúcidos"), sin reiniciar.
// Así no hace falta Pywalfox, cuyo tema deja la ventana opaca.
//   ~/.cache/velure/firefox-userChrome.css        colores (plantilla de paleta)
//   ~/.local/state/velure/firefox-translucent.css  marco translúcido (vacío si apagado)
// Las páginas (la nueva pestaña) no admiten estilos así: van en userContent.css y se
// ven al reiniciar Firefox (ver translucent.sh).
(function () {
    try {
        const Cc = Components.classes, Ci = Components.interfaces;
        const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
        const home = Services.dirsvc.get("Home", Ci.nsIFile).path;
        const sheets = [
            { path: home + "/.cache/velure/firefox-userChrome.css", type: sss.USER_SHEET },
            { path: home + "/.local/state/velure/firefox-translucent.css", type: sss.USER_SHEET }
        ];

        function sync(sheet) {
            const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
            file.initWithPath(sheet.path);
            const stamp = file.exists() ? file.lastModifiedTime : 0;
            if (stamp === sheet.stamp) return;
            sheet.stamp = stamp;
            if (sheet.uri && sss.sheetRegistered(sheet.uri, sheet.type))
                sss.unregisterSheet(sheet.uri, sheet.type);
            sheet.uri = null;
            if (!stamp) return;
            // Como data: (el CSS dentro de la dirección): cada versión es una dirección
            // distinta y Firefox no reutiliza la anterior de su caché
            const stream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
            stream.init(file, -1, 0, 0);
            const conv = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(Ci.nsIConverterInputStream);
            conv.init(stream, "UTF-8", 0, 0);
            let css = "";
            const chunk = {};
            while (conv.readString(65536, chunk) > 0) css += chunk.value;
            conv.close();
            if (css.trim() === "") return;
            sheet.uri = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
            sss.loadAndRegisterSheet(sheet.uri, sheet.type);
        }

        // Hasta que no arranca la interfaz no se toca el servicio de estilos: hacerlo
        // antes (aún sin perfil) deja userChrome.css sin cargar
        const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
        Services.obs.addObserver(function start() {
            Services.obs.removeObserver(start, "final-ui-startup");
            sheets.forEach(s => { try { sync(s); } catch (e) {} });
            timer.initWithCallback({ notify: () => sheets.forEach(s => { try { sync(s); } catch (e) {} }) },
                1500, Ci.nsITimer.TYPE_REPEATING_SLACK);
        }, "final-ui-startup");
        // Que el temporizador no se pierda
        globalThis.velureStyleTimer = timer;
    } catch (e) {
        Components.utils.reportError("velure.cfg: " + e);
    }
})();
