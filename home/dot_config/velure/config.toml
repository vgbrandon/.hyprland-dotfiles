# Qué escribe velure (~/.local/bin/velure) con los colores del fondo de pantalla.
# Quickshell lo ejecuta cada vez que cambia el fondo.

# Cada app la escribe velure: él sabe qué color va en cada sitio y dónde se escribe.
# Aquí solo se elige cuáles, y la salida o el gancho si hace falta.
# Zed: ~/.config/zed/themes/velure.json. Translúcido si está activado en Quickshell
[apps.zed]
gancho = 'sh ~/.config/velure/scripts/translucent.sh zed'

# kitty: ~/.config/kitty/velure.conf, cargado con "globinclude velure.conf" en kitty.conf.
# SIGUSR1 hace que las ventanas abiertas recarguen la config al instante.
[apps.kitty]
gancho = 'pkill -USR1 -x kitty || true'

# fish: ~/.config/fish/velure-colors.fish, el resaltado (lo que se escribe, el completado).
# config.fish lo carga; el aviso de starship (abajo) hace que las terminales abiertas lo
# vuelvan a cargar, por eso va antes.
[apps.fish]

# starship: la paleta ~/.config/starship/palette-velure.toml, que starship.sh une con
# starship.toml. Starship lee la config en cada prompt, así que el cambio se ve al instante.
[apps.starship]
gancho = 'sh ~/.config/velure/scripts/starship.sh --notify'

# fastfetch: config.jsonc a partir de ~/.config/fastfetch/base.jsonc (los módulos son tuyos;
# velure pone el logo y las claves en el primario)
[apps.fastfetch]

# eza (ls): ~/.config/eza/theme.yml. Color solo para lo que significa algo; los iconos toman
# el color de cada tipo de archivo
[apps.eza]

# GTK3: los colores del tema "Velure" (~/.local/share/themes/Velure/gtk-3.0/colors.css; su
# gtk.css, que importa adw-gtk3-dark, está en los dotfiles). gtk-reload.sh hace que las apps
# abiertas lo recarguen (saltando a su copia gemela, sin pasar por otro tema).
[apps.gtk3]
gancho = 'sh ~/.config/velure/scripts/gtk-reload.sh gtk'

# GTK4/libadwaita: ~/.config/gtk-4.0/gtk.css, que cada app lee al abrirse
[apps.gtk4]

# Iconos: tema "Velure" (Adwaita con las carpetas en el tono del primario). gtk-reload.sh
# hace que las apps abiertas los recarguen, igual que el tema GTK3.
[apps.iconos]
gancho = 'sh ~/.config/velure/scripts/gtk-reload.sh icons'

# Firefox: los CSS del marco, de las páginas internas y sus versiones translúcidas, en
# ~/.cache/velure. velure.cfg carga el marco en vivo; firefox.sh lleva las páginas al
# perfil y translucent.sh aplica la translucidez si está activada en Quickshell.
[apps.firefox]
gancho = 'sh ~/.config/velure/scripts/firefox.sh && sh ~/.config/velure/scripts/translucent.sh firefox'

# tidal-hifi: tema "velure" (seleccionado en su config como user:velure.css). Tidal lo
# aplica al cargar la página: si está abierto, tidal.sh lo recarga (Ctrl+R).
[apps.tidal]
gancho = 'sh ~/.config/velure/scripts/tidal.sh'
