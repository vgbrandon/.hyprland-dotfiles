# Generado por paleta (~/.local/bin/paleta) desde el fondo de pantalla. No editar a
# mano: se sobrescribe cada vez que cambia el fondo. Usa los papeles de la paleta
# (p_*: los mismos que Velure) y sus colores de terminal (term_*).

# Fondo y texto: los de la barra y los paneles
foreground              {{colors.p_text.default.hex}}
background              {{colors.p_background.default.hex}}
# Selección: el tono en profundo (como lo seleccionado en Velure)
selection_foreground    {{colors.p_onContainer.default.hex}}
selection_background    {{colors.p_container.default.hex}}
# Cursor y enlaces: el acento
cursor                  {{colors.p_accent.default.hex}}
cursor_text_color       {{colors.p_onAccent.default.hex}}
url_color               {{colors.p_accent2.default.hex}}

# Bordes de ventanas (splits): el activo en acento, el resto discreto
active_border_color     {{colors.p_accent.default.hex}}
inactive_border_color   {{colors.p_outlineVariant.default.hex}}
bell_border_color       {{colors.p_warning.default.hex}}

# Pestañas: la activa en el tono en profundo, las demás sobre el fondo
tab_bar_background      {{colors.p_background.default.hex}}
active_tab_foreground   {{colors.p_onContainer.default.hex}}
active_tab_background   {{colors.p_container.default.hex}}
inactive_tab_foreground {{colors.p_subtext.default.hex}}
inactive_tab_background {{colors.p_surface1.default.hex}}

# Marcas (kitty +kitten hints, búsquedas)
mark1_foreground        {{colors.p_onAccent.default.hex}}
mark1_background        {{colors.p_accent.default.hex}}
mark2_foreground        {{colors.p_onAccent.default.hex}}
mark2_background        {{colors.p_accent2.default.hex}}
mark3_foreground        {{colors.p_onAccent.default.hex}}
mark3_background        {{colors.p_accent3.default.hex}}

# Colores ANSI: tonos fijos acercados al acento, el normal y el brillante bien
# distinguibles
# negro
color0  {{colors.p_surface3.default.hex}}
color8  {{colors.p_outline.default.hex}}
# rojo
color1  {{colors.term_red.default.hex}}
color9  {{colors.term_red_bright.default.hex}}
# verde
color2  {{colors.term_green.default.hex}}
color10 {{colors.term_green_bright.default.hex}}
# amarillo
color3  {{colors.term_yellow.default.hex}}
color11 {{colors.term_yellow_bright.default.hex}}
# azul
color4  {{colors.term_blue.default.hex}}
color12 {{colors.term_blue_bright.default.hex}}
# magenta
color5  {{colors.term_magenta.default.hex}}
color13 {{colors.term_magenta_bright.default.hex}}
# cian
color6  {{colors.term_cyan.default.hex}}
color14 {{colors.term_cyan_bright.default.hex}}
# blanco
color7  {{colors.p_subtext.default.hex}}
color15 {{colors.p_text.default.hex}}
